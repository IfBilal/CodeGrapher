[project]
name = "codegrapher"
version = "0.1.0"
description = "Autonomous codebase knowledge graph & impact analysis engine"
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=1.15.6",
    "python-dotenv>=1.2.2",
]

[project.scripts]
codegrapher-cartography = "codegrapher.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegrapher"]
