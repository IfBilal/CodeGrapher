[project]
name = "codegrapher"
version = "0.1.0"
description = "Autonomous codebase knowledge graph & impact analysis engine"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "crewai[litellm]>=1.15.6",
    "fastapi>=0.140.0",
    "fastembed>=0.4.0",
    "neo4j>=6.2.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
codegrapher-cartography = "codegrapher.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegrapher"]
