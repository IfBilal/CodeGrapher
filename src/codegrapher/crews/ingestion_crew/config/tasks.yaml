map_architecture_task:
  description: >
    Analyze the following parsed repository structure (JSON, produced by the
    static AST parser - treat it as ground truth, not the raw source code):

    {parsed_repo}

    Identify the architectural layers present (e.g. API/routes layer,
    service layer, data/ORM layer) and assign every file in the input to
    exactly one layer. For each layer, list its files and one sentence on
    its responsibility. Identify the system's entry points (the routes with
    an http_method and route path).
  expected_output: >
    A markdown report with a "## Architectural Layers" section (one
    subsection per layer, listing file paths and responsibility) and a
    "## Entry Points" section listing every HTTP route found, its method,
    and the file that defines it.
  agent: cartographer
  async_execution: true

extract_schema_task:
  description: >
    Analyze the following parsed repository structure (JSON, produced by the
    static AST parser - treat it as ground truth, not the raw source code):

    {parsed_repo}

    Extract every ORM model (classes with is_orm_model: true). For each,
    list its fields with types, mark primary keys and foreign keys, and
    list its relationships including cascade behavior. Then, for every
    function with a non-empty mutates_models list, record which model(s)
    it mutates, its http_method + route, and the file it lives in.
  expected_output: >
    A markdown report with a "## ORM Models" section (one subsection per
    model: fields table, primary/foreign keys, relationships) and a
    "## Mutation Paths" section listing, for each mutating route, the
    route, method, file, and the model(s) it writes to.
  agent: orm_schema_agent
  async_execution: true

join_reports_task:
  description: >
    You have been given two reports in your context: an architecture report
    (from the Codebase Cartographer) and a schema report (from the Data &
    ORM Schema Agent). Reproduce both reports verbatim, exactly as given -
    do not summarize, rephrase, reformat, or add commentary of your own.
    This task exists only to synchronize the two reports above, which were
    produced in parallel; it adds no new analysis.
  expected_output: >
    The architecture report verbatim, then the schema report verbatim,
    each under its own heading, with no other changes.
  agent: report_joiner

anti_pattern_task:
  description: >
    Here is the parsed repository structure (JSON, ground truth):

    {parsed_repo}

    You also have the architecture report and the schema report, produced
    by earlier agents in this crew, in your context - use them.

    Scan for: (1) circular import dependencies, (2) god objects - classes
    or files with a disproportionate number of fields/functions/
    responsibilities compared to the rest of the input, and (3) tight
    coupling - functions that call into many unrelated modules directly.
    For each finding, cite the exact files/classes/functions and edges
    that constitute it. If a category has no findings in the provided
    data, say so explicitly rather than omitting it.
  expected_output: >
    A markdown report with three sections - "## Circular Dependencies",
    "## God Objects", "## Tight Coupling" - each either listing concrete
    findings with cited evidence, or stating "No instances found in the
    provided data."
  agent: anti_pattern_agent
