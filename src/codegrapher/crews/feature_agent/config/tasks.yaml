generate_feature_stub_task:
  description: >
    A new feature has been requested for this repository:

    "{feature_request}"

    Here is the parsed repository structure (JSON, ground truth):

    {parsed_repo}

    Here are the reports already produced by earlier agents in the
    pipeline - use them to match existing conventions and avoid repeating
    known risks:

    Architecture report:
    {architecture_report}

    Schema report:
    {schema_report}

    Anti-pattern report (avoid repeating any tight coupling or god-object
    pattern flagged here):
    {anti_pattern_report}

    The detected primary language is: {primary_language}.

    Write a code stub in that language only. For a TypeScript repository,
    emit TypeScript/TSX using the repository's actual file conventions;
    never emit Python, FastAPI, Pydantic, or ORM code unless those facts
    appear in the parsed repository. Follow existing layering and naming
    conventions only when they are evidenced in the structural facts. Do
    not invent framework details, routes, base classes, or persistence
    layers that are not implied by those facts. Explicitly avoid any
    anti-pattern flagged above.
  expected_output: >
    A markdown response with a "## Code Stub" section containing the
    code in a fenced block labelled with the detected language (for example
    ```typescript), and a "## Contract Notes" section
    listing, as bullet points, which existing conventions were matched and
    which flagged risk(s) the stub deliberately avoids.
  agent: feature_architect
