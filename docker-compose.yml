services:
  neo4j:
    image: neo4j:5.18-community
    container_name: codegrapher-neo4j
    ports:
      - "7474:7474" # HTTP browser UI
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/codegrapher_dev
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: codegrapher-qdrant
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    container_name: codegrapher-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: codegrapher
      POSTGRES_PASSWORD: codegrapher_dev
      POSTGRES_DB: codegrapher
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: codegrapher-redis
    ports:
      - "6379:6379"

  # --- Application services (not yet built - see Dockerfile.api /
  # frontend/Dockerfile). Env vars point at service names, not localhost,
  # since containers reach each other by service name on the compose
  # network rather than through published host ports. ---

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: codegrapher-api
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: codegrapher_dev
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://codegrapher:codegrapher_dev@postgres:5432/codegrapher
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - neo4j
      - qdrant
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: codegrapher-worker
    command: ["celery", "-A", "codegrapher.api.celery_app", "worker", "--loglevel=info", "--pool=solo"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: codegrapher_dev
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://codegrapher:codegrapher_dev@postgres:5432/codegrapher
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - neo4j
      - qdrant
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: codegrapher-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
